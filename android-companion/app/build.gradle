plugins { id 'com.android.application' }
android {
    namespace 'top.jxzs.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'top.jxzs.companion'
        minSdk 35
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('JXZS_KEYSTORE_PATH') ?: '../jxzs-signing.p12')
            storePassword System.getenv('JXZS_KEYSTORE_PASSWORD')
            keyAlias 'jxzs'
            keyPassword System.getenv('JXZS_KEYSTORE_PASSWORD')
            storeType 'PKCS12'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
