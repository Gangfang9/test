# Preparation only. Requires a valid certificate and verified filing/access.
# The current www.jxzs.top site remains a separate, unchanged server block.
server {
    listen 80;
    server_name jxzs.host.mg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jxzs-host-mg-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name jxzs.host.mg;

    ssl_certificate /etc/letsencrypt/live/jxzs.host.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jxzs.host.mg/privkey.pem;

    # Only the public membership API is available on this hostname.
    location ~ ^/v1/(register|login|heartbeat|redeem|logout)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:19081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / { return 404; }
}
