# Installed on 2026-09-25; certificate and renewal hook are managed by Certbot.
# The current www.jxzs.top site remains a separate, unchanged server block.
limit_req_zone $binary_remote_addr zone=jx_host_mg_membership:10m rate=30r/m;

server {
    listen 80;
    server_name jxzs.host.mg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jxzs-host-mg-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name jxzs.host.mg;

    ssl_certificate /etc/letsencrypt/live/jxzs.host.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jxzs.host.mg/privkey.pem;

    # Only the public membership API is available on this hostname.
    location ~ ^/v1/(register|login|heartbeat|redeem|logout)$ {
        limit_except POST { deny all; }
        limit_req zone=jx_host_mg_membership burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:19081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / { return 404; }
}
