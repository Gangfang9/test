# Enable only after ICP approval, DNS setup, and certificate issuance.
# Keep the upstream bound to 127.0.0.1; never publish port 19080.
server {
    listen 443 ssl;
    server_name admin.jxzs.top;

    ssl_certificate /etc/letsencrypt/live/admin.jxzs.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.jxzs.top/privkey.pem;

    location / {
        # Applies to every admin route and asset. The shipped file denies all.
        include /etc/nginx/snippets/jx-admin-allowlist.conf;
        proxy_pass http://127.0.0.1:19080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
