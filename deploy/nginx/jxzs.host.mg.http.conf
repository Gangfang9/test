# Preparation only. Do not enable on the mainland server until host.mg's
# applicable ICP filing and Tencent Cloud access status are verified.
# Enable this temporary port-80 site before requesting an HTTP-01 certificate.
server {
    listen 80;
    server_name jxzs.host.mg;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jxzs-host-mg-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
