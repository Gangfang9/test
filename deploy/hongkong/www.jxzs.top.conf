# Install after obtaining the certificate using the HTTP challenge webroot.
limit_req_zone $binary_remote_addr zone=jx_membership:10m rate=30r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name www.jxzs.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/jx-acme; }
    location / { return 301 https://www.jxzs.top$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jxzs.top;
    ssl_certificate /etc/letsencrypt/live/www.jxzs.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jxzs.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ~ ^/v1/(register|login|heartbeat|redeem|logout)$ {
        limit_req zone=jx_membership burst=30 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 8k;
        client_body_timeout 10s;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:19081;
    }
    location / { return 404; }
}
