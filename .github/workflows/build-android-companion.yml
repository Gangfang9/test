name: Build JXZS Android companion
on:
  workflow_dispatch:
  push:
    branches: [mvp-usb-single-device]
    paths: ['android-companion/**', 'tests/android-companion-smoke.py', '.github/workflows/build-android-companion.yml']
permissions:
  contents: read
jobs:
  android:
    name: Android 15 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare private signing key
        env:
          JXZS_KEYSTORE_BASE64: ${{ secrets.JXZS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$JXZS_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$JXZS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jxzs.p12"
      - name: Build, test and lint Android APK
        working-directory: android-companion
        env:
          JXZS_KEYSTORE_PATH: ${{ runner.temp }}/jxzs.p12
          JXZS_KEYSTORE_PASSWORD: ${{ secrets.JXZS_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install smoke test dependencies
        run: python -m pip install Pillow
      - name: Android 15 USB pointer smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python tests/android-companion-smoke.py android-companion/app/build/outputs/apk/release/app-release.apk
      - name: Name installable APK
        run: cp android-companion/app/build/outputs/apk/release/app-release.apk JXZS-Android-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JXZS-Android-15
          path: JXZS-Android-1.0.0.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JXZS-Android-test-results
          path: android-smoke-results/
          if-no-files-found: ignore
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/jxzs.p12"
